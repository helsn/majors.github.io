<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Top 10 Highest Paying College Majors </title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
<svg id="chart"></svg>

<script>
const width = 1000;
const height = 600;
  
const svg = d3.select("#chart").attr("width", width).attr("height", height);
  
d3.csv("https://raw.githubusercontent.com/fivethirtyeight/data/master/college-majors/all-ages.csv").then(function(data) {
  data.forEach(d => {d.Median = +d.Median;});
  data.sort((a, b) => b.Median - a.Median);
  const top10 = data.slice(0,10);
  const x = d3.scaleLinear()
            .domain([0, d3.max(top10, d => d.Median)])
            .range([200, width - 50]);
  const y = d3.scaleBand()
            .domain(top10.map(d => d.Major))
            .range([50, height - 50])
            .padding(0.2);

  svg.selectAll("rect")
      .data(top10).enter().append("rect")
      .attr("x", 200)
      .attr("y", d => y(d.Major))
      .attr("width", d => x(d.Median) - 200)
      .attr("height", y.bandwidth())
      .attr("fill", "magenta");

  svg.append("g")
      .attr("transform", "translate(0, 550)")
      .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", "translate(200,0)")
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", 500)
      .attr("y", 25)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Top 10 Highest Paying College Majors");

  svg.append("text")
      .attr("x", 300)
      .attr("y", 590)
      .attr("text-anchor", "middle")
      .text("Median Salary ($)");
  
});
  
  
</script>

  
</body>
</html>
