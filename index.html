<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> College Majors & Salaries </title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{font-family: Arial, sans-serif;
         text-align: center;}
    button{
      margin:15px;
      padding: 5px 20px;
      font-size: 12px;}
  </style>
</head>

<body>

<h3> College Majors & Salaries </h3>
<button id = "next">Next </button>
<svg id="chart"></svg>

<script>


const width = 1000;
const height = 600;
  
const svg = d3.select("#chart").attr("width", width).attr("height", height);

let data;
let scene = 1;
let top10;
let top10Majors;
  
d3.csv("https://raw.githubusercontent.com/fivethirtyeight/data/master/college-majors/all-ages.csv")
  .then(function(csv) {
      csv.forEach(d => {d.Median = +d.Median;
                    d.Unemployment_rate = +d.Unemployment_rate;
                       });
      data = csv;
      top10 = [...data].sort((a, b) => b.Median - a.Median)
                .slice(0,10);
      top10Majors = new Set(top10.map(d => d.Major));
      render(); 
    });

d3.select("#next").on("click", function(){
      scene = scene + 1;
      if (scene > 2) {
        scene = 1;
      }
      render();
});

function render() {
  svg.selectAll("*").remove();
  if (scene == 1){
    drawScene1();
  }
  if (scene == 2) {
    drawScene2();
  }
}
  
  
function drawScene1(){
  const x = d3.scaleLinear()
            .domain([0, d3.max(top10, d => d.Median)])
            .range([200, width - 50]);
  const y = d3.scaleBand()
            .domain(top10.map(d => d.Major))
            .range([50, height - 50])
            .padding(0.2);

  svg.selectAll("rect")
      .data(top10).enter().append("rect")
      .attr("x", 200)
      .attr("y", d => y(d.Major))
      .attr("width", d => x(d.Median) - 200)
      .attr("height", y.bandwidth())
      .attr("fill", "lightblue");

  svg.append("g")
      .attr("transform", "translate(0, 540)")
      .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", "translate(200,0)")
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", 500)
      .attr("y", 25)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Top 10 Highest Paying College Majors");

  svg.append("text")
      .attr("x", 300)
      .attr("y", 590)
      .attr("text-anchor", "middle")
      .text("Median Salary ($)");
}

function drawScene2() {
  const x = d3.scaleLinear()
            .domain(d3.extent(data, d => d.Median))
            .range([100, width - 50]);
  const y = d3.scaleLinear()
            .domain([0, d3.max(data, d => d.Unemployment_rate)])
            .range([height-75, 50]);
  
  svg.selectAll("circle")
    .data(data).enter().append("circle")
    .attr("cx", d => x(d.Median))
    .attr("cy", d => y(d.Unemployment_rate))
    .attr("r", 5)
    .attr("fill", d => top10Majors.has(d.Major) ? "lightblue" : "lightyellow");

  svg.append("g")
    .attr("transform", "translate(0, 500)")
    .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", "translate(100,0)")
      .call(d3.axisLeft(y));
}
  
  
</script>
</body>
</html>
