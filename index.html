<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> College Majors & Salaries </title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{font-family: Arial, sans-serif;
         text-align: center;}
    button{
      margin:15px;
      padding: 5px 20px;
      font-size: 12px;}
  </style>
</head>

<body>

<h3> College Majors & Salaries </h3>
<button id = "next">Next </button>
<svg id="chart"></svg>

<script>


const width = 1000;
const height = 600;
  
const svg = d3.select("#chart").attr("width", width).attr("height", height);

let data;
let scene = 1;
let top5;
let top5Majors;
let bottom5;
let bottom5Majors;
let comparison;
  
d3.csv("https://raw.githubusercontent.com/fivethirtyeight/data/master/college-majors/all-ages.csv")
  .then(function(csv) {
      csv.forEach(d => {d.Median = +d.Median;
                    d.Unemployment_rate = +d.Unemployment_rate;
                       });
      data = csv;
    
      const sorted = [...data].sort((a, b) => b.Median - a.Median);
      top5 = sorted.slice(0,5);
      bottom5 = sorted.slice(-5);
      comparison = [...top5, ...bottom5];
    
      top5Majors = new Set(top5.map(d => d.Major));
      bottom5Majors = new Set(bottom5.map(d => d.Major));
    
      render(); 
    });

d3.select("#next").on("click", function(){
      scene = scene + 1;
      if (scene > 3) {
        scene = 1;
      }
      render();
});

function render() {
  svg.selectAll("*").remove();
  if (scene == 1){
    drawScene1();
  }
  if (scene == 2) {
    drawScene2();
  }
  if (scene == 3) {
    drawScene3();
  }
}
  
  
function drawScene1(){
  const x = d3.scaleLinear()
            .domain([0, d3.max(comparison, d => d.Median)])
            .range([200, width - 50]);
  const y = d3.scaleBand()
            .domain(comparison.map(d => d.Major))
            .range([50, height - 50])
            .padding(0.2);

  svg.selectAll("rect")
      .data(comparison).enter().append("rect")
      .attr("x", 200)
      .attr("y", d => y(d.Major))
      .attr("width", d => x(d.Median) - 200)
      .attr("height", y.bandwidth())
      .attr("fill", d => {
        if (top5Majors.has(d.Major))
          return "lightblue";
        return "lightcoral";
});

  svg.append("g")
      .attr("transform", "translate(0, 540)")
      .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", "translate(200,0)")
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", 500)
      .attr("y", 25)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Top 5 vs Bottom 5 Highest Paying College Majors");

  svg.append("text")
      .attr("x", 300)
      .attr("y", 590)
      .attr("text-anchor", "middle")
      .text("Median Salary ($)");
}

function drawScene2() {
  const x = d3.scaleLinear()
            .domain(d3.extent(data, d => d.Median))
            .range([100, width - 50]);
  const y = d3.scaleLinear()
            .domain([0, d3.max(data, d => d.Unemployment_rate)])
            .range([height-75, 50]);
  
  svg.selectAll("circle")
    .data(data).enter().append("circle")
    .attr("cx", d => x(d.Median))
    .attr("cy", d => y(d.Unemployment_rate))
    .attr("r", d => {
      if (top5Majors.has(d.Major) || bottom5Majors.has(d.Major))
        return 7;
      return 4;
    })
    .attr("fill", d => {
      if (top5Majors.has(d.Major))
        return "lightblue";
      if (bottom5Majors.has(d.Major))
        return "lightcoral";
    });

  svg.append("g")
    .attr("transform", "translate(0, 500)")
    .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", "translate(100,0)")
      .call(d3.axisLeft(y));
}

function drawScene3() {
  const x = d3.scaleLinear()
            .domain([d3.min(comparison, d => +d.P25th) - 5000,
                    d3.max(comparison, d => +d.P75th) + 5000])
            .range([200, width - 60]);
  const y = d3.scaleBand()
            .domain(comparison.map(d => d.Major))
            .range([50, height - 75]);

   svg.selectAll(".range").data(comparison).enter().append("line")
          .attr("class", "range")
          .attr("x1", d => x(+d.P25th))
          .attr("x2", d => x(+d.P75th))
          .attr("y1", d => y(d.Major) + y.bandwidth()/2)
          .attr("y2", d => y(d.Major) + y.bandwidth()/2)
          .attr("stroke", d => {
              if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
          });

  svg.selectAll(".low").data(comparison).enter().append("circle")
          .attr("class", "low")
          .attr("cx", d => x(+d.P25th))
          .attr("cy", d => y(d.Major) + y.bandwidth()/2)
          .attr("r", 5)
          .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
          });

  svg.selectAll(".high").data(comparison).enter().append("circle")
        .attr("class", "high")
        .attr("cx", d => x(+d.P75th))
        .attr("cy", d => y(d.Major) + y.bandwidth()/2)
        .attr("r", 5)
        .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
        });

  svg.selectAll(".median").data(comparison).enter().append("circle")
        .attr("class", "median")
        .attr("cx", d => x(+d.Median))
        .attr("cy", d => y(d.Major) + y.bandwidth()/2)
        .attr("r", 5)
        .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
        });

  svg.append("g")
      .attr("transform", "translate(0, 525)")
      .call(d3.axisBottom(x).tickFormat(d3.format("$,")));

  svg.append("g")
      .attr("transform", "translate(220, 0)")
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", width/2)
      .attr("y", 30)
      .attr("text-anchor", "middle")
      .text("Salary Distribution of Top 5 and Bottom 5 Highest Paying Majors");

}
  
  
</script>
</body>
</html>
