<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> College Majors & Salaries </title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body{font-family: Arial, sans-serif;
         text-align: center;}
    button{
      margin:15px;
      padding: 5px 20px;
      font-size: 12px;}
  </style>
</head>

<body>

<h1> College Majors & Salaries </h1>
<button id = "next">Next </button>
<svg id="chart"></svg>

<script>

const width = 1200;
const height = 600;
const margin = {
  top: 75,
  right: 60,
  bottom: 75,
  left: 350
};
  
const svg = d3.select("#chart").attr("width", width).attr("height", height);

let data;
let scene = 1;
let top5;
let top5Majors;
let bottom5;
let bottom5Majors;
let comparison;
  
d3.csv("https://raw.githubusercontent.com/fivethirtyeight/data/master/college-majors/all-ages.csv")
  .then(function(csv) {
      csv.forEach(d => {d.Median = +d.Median;
                    d.Unemployment_rate = +d.Unemployment_rate;
                       });
      data = csv;
    
      const sorted = [...data].sort((a, b) => b.Median - a.Median);
      top5 = sorted.slice(0,5);
      bottom5 = sorted.slice(-5);
      comparison = [...top5, ...bottom5];
    
      top5Majors = new Set(top5.map(d => d.Major));
      bottom5Majors = new Set(bottom5.map(d => d.Major));
    
      render(); 
    });

d3.select("#next").on("click", function(){
      scene = scene + 1;
      if (scene > 3) {
        scene = 1;
      }
      render();
});

function render() {
  svg.selectAll("*").remove();
  if (scene == 1){
    drawScene1();
  }
  if (scene == 2) {
    drawScene2();
  }
  if (scene == 3) {
    drawScene3();
  }
}

function addLegend (showOther = false) {
  const legend = svg.append("g")
                  .attr("transform", `translate(${width - margin.right - 250}, ${margin.top - 50})`);
  legend.append("rect")
        .attr("width", 20)
        .attr("height", 20)
        .attr("fill", "lightblue");
  legend.append("text")
        .attr("x", 30)
        .attr("y", 15)
        .text("Top 5 Highest Paying Majors");
  legend.append("rect")
        .attr("y", 40)
        .attr("width", 20)
        .attr("height", 20)
        .attr("fill", "lightcoral");
  legend.append("text")
        .attr("x", 30)
        .attr("y", 55)
        .text("Bottom 5 Highest Paying Majors");

  if (showOther) {
    legend.append("rect")
        .attr("y", 80)
        .attr("width", 20)
        .attr("height", 20)
        .attr("fill", "lightgray");
    legend.append("text")
        .attr("x", 30)
        .attr("y", 95)
        .text("Other Majors");
  }
}
  
function drawScene1(){
  const x = d3.scaleLinear()
            .domain([0, d3.max(comparison, d => d.Median)])
            .range([margin.left, width - margin.right]);
  const y = d3.scaleBand()
            .domain(comparison.map(d => d.Major))
            .range([margin.top, height - margin.bottom])
            .padding(0.2);

  svg.selectAll("rect")
      .data(comparison).enter().append("rect")
      .attr("x", margin.left)
      .attr("y", d => y(d.Major))
      .attr("width", d => x(d.Median) - margin.left)
      .attr("height", y.bandwidth())
      .attr("fill", d => {
        if (top5Majors.has(d.Major))
          return "lightblue";
        return "lightcoral";
});

  svg.append("g")
      .attr("transform", `translate(0, ${height - margin.bottom})`)
      .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", `translate(${margin.left}, 0)`)
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", width/2)
      .attr("y", 35)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Top 5 vs Bottom 5 Highest Paying College Majors");

  svg.append("text")
      .attr("x", width/2)
      .attr("y", 590)
      .attr("text-anchor", "middle")
      .text("Median Salary ($)");

  addLegend();
}

function drawScene2() {
  const x = d3.scaleLinear()
            .domain([d3.min(data, d => d.Median) - 3000,
                   d3.max(data, d => d.Median) + 3000])
            .range([margin.left, width - margin.right]);
  const y = d3.scaleLinear()
            .domain([0, d3.max(data, d => d.Unemployment_rate)])
            .range([height - margin.bottom, margin.top]);
  
  svg.selectAll("circle")
    .data(data).enter().append("circle")
    .attr("cx", d => x(d.Median))
    .attr("cy", d => y(d.Unemployment_rate))
    .attr("r", d => {
      if (top5Majors.has(d.Major) || bottom5Majors.has(d.Major))
        return 7;
      return 4;
    })
    .attr("fill", d => {
      if (top5Majors.has(d.Major))
        return "lightblue";
      if (bottom5Majors.has(d.Major))
        return "lightcoral";
      return "lightgray";
    });

  svg.append("g")
    .attr("transform", `translate(0, ${height - margin.bottom})`)
    .call(d3.axisBottom(x));

  svg.append("g")
      .attr("transform", `translate(${margin.left}, 0)`)
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", width/2)
      .attr("y", 35)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Median Salary vs Unemployment Rate");

  svg.append("text")
      .attr("x", width/2)
      .attr("y", height - 20)
      .attr("text-anchor", "middle")
      .text("Median Salary ($)");
 
  svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2)
      .attr("y", margin.left)
      .attr("text-anchor", "middle")
      .text("Unemployment Rate");

  addLegend(true);
}

function drawScene3() {
  const x = d3.scaleLinear()
            .domain([d3.min(comparison, d => +d.P25th) - 5000,
                    d3.max(comparison, d => +d.P75th) + 5000])
            .range([margin.left, width - margin.right]);
  const y = d3.scaleBand()
            .domain(comparison.map(d => d.Major))
            .range([margin.top, height - margin.bottom])
            .padding(0.4);

   svg.selectAll(".range").data(comparison).enter().append("line")
          .attr("class", "range")
          .attr("x1", d => x(+d.P25th))
          .attr("x2", d => x(+d.P75th))
          .attr("y1", d => y(d.Major) + y.bandwidth()/2)
          .attr("y2", d => y(d.Major) + y.bandwidth()/2)
          .attr("stroke", d => {
              if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
          });

  svg.selectAll(".low").data(comparison).enter().append("circle")
          .attr("class", "low")
          .attr("cx", d => x(+d.P25th))
          .attr("cy", d => y(d.Major) + y.bandwidth()/2)
          .attr("r", 5)
          .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
          });

  svg.selectAll(".high").data(comparison).enter().append("circle")
        .attr("class", "high")
        .attr("cx", d => x(+d.P75th))
        .attr("cy", d => y(d.Major) + y.bandwidth()/2)
        .attr("r", 5)
        .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
        });

  svg.selectAll(".median").data(comparison).enter().append("circle")
        .attr("class", "median")
        .attr("cx", d => x(+d.Median))
        .attr("cy", d => y(d.Major) + y.bandwidth()/2)
        .attr("r", 5)
        .attr("fill", d => {
            if (top5Majors.has(d.Major))
                return "lightblue";
              return "lightcoral";
        });

  svg.append("g")
      .attr("transform", `translate(0, ${height - margin.bottom})`)
      .call(d3.axisBottom(x).tickFormat(d3.format("$,")));

  svg.append("g")
      .attr("transform", `translate(${margin.left}, 0)`)
      .call(d3.axisLeft(y));

  svg.append("text")
      .attr("x", width/2)
      .attr("y", 35)
      .attr("text-anchor", "middle")
      .attr("font-size", "24px")
      .attr("font-weight", "bold")
      .text("Salary Distribution of Top 5 vs Bottom 5 Majors");

  svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 20)
      .attr("text-anchor", "middle")
      .text("Annual Salary ($)");

  addLegend();

}
  
  
</script>
</body>
</html>
